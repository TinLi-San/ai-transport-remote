<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Transport · 蓝牙播控器</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="cover.css">
</head>
<body>
  <main class="poster">
    <header class="meta">
      <p class="brand">AI Transport</p>
      <p class="meta__right">AI Passport · BLE HID</p>
    </header>

    <section class="split">
      <div>
        <h1 class="statement"><span>PAIR.</span><span>PRESS.</span><span>PLAY.</span></h1>
        <p class="lede">三颗键，一块屏。<b>配对即用</b>：快进、快退、播放、全屏、音量，电脑上不需要装任何程序。</p>
      </div>

      <aside>
        <table class="keys">
          <caption>Keys</caption>
          <thead>
            <tr><th scope="col">Key</th><th scope="col">Tap</th><th scope="col">Hold</th></tr>
          </thead>
          <tbody>
            <tr><td>↑</td><td>FF</td><td>NEXT</td></tr>
            <tr><td>↓</td><td>REW</td><td>PREV</td></tr>
            <tr><td>ENTER</td><td>PLAY</td><td>FULLSCR</td></tr>
            <tr><td>ENTER+↑</td><td>VOL+</td><td>—</td></tr>
            <tr><td>ENTER+↓</td><td>VOL−</td><td>—</td></tr>
          </tbody>
        </table>
        <p class="spec">ESP32-C3 · BLE HID · 8 MB Flash · 3 Keys</p>
      </aside>
    </section>

    <hr class="rule">

    <footer class="foot">
      <p class="note">AI Passport Community · 2026</p>
      <p class="note">v0.1.0</p>
    </footer>
  </main>
</body>
</html>
